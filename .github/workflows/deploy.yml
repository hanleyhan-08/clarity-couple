name: Deploy Frontend

on:
  push:
    branches:
      - prod
    paths:
      - 'clarity-couple/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Build
        run: |
          pnpm build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "dist/*,nginx/cc.rima-app.com.conf"
          target: "/tmp/clarity-deploy" 
          strip_components: 0 # We want to keep structure or handle it in script

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # Move frontend files
            # Ensure target directory exists
            sudo mkdir -p /var/www/html/clarity-couple
            sudo cp -r /tmp/clarity-deploy/dist/* /var/www/html/clarity-couple/
            
            # Move Nginx config
            sudo cp /tmp/clarity-deploy/nginx/cc.rima-app.com.conf /etc/nginx/sites-available/cc.rima-app.com.conf
            sudo ln -sf /etc/nginx/sites-available/cc.rima-app.com.conf /etc/nginx/sites-enabled/
            
            # Check for SSL and obtain if missing
            if ! sudo certbot certificates | grep -q "cc.rima-app.com"; then
                sudo certbot --nginx -d cc.rima-app.com --non-interactive --agree-tos -m admin@rima-app.com --redirect
            fi
            
            # Reload Nginx
            sudo nginx -t && sudo systemctl reload nginx
            
            # Cleanup
            rm -rf /tmp/clarity-deploy
